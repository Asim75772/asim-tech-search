<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ASIM TECH SEARCH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Arial,"Segoe UI","Noto Sans Bengali",sans-serif;
  color:#fff;
  background:
    linear-gradient(rgba(2,15,35,.18),rgba(2,15,35,.30)),
    url("mountain-bg.png") center center/cover fixed no-repeat;
}
.page{min-height:100vh;padding:20px 28px 35px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:30px;font-weight:900;letter-spacing:1px}
.logo span{color:#08a8ff}
.top-links{display:flex;gap:14px}
.top-links a,.theme{
  color:#fff;text-decoration:none;
  padding:13px 24px;border-radius:30px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.20);
  backdrop-filter:blur(10px);
  font-weight:700
}
.theme{cursor:pointer;font-size:20px;padding:10px 16px}

main{max-width:1180px;margin:auto;text-align:center;padding-top:85px}
.hero{position:relative}
.side{
  position:absolute;top:15px;width:210px;
  font-family:cursive;font-size:23px;line-height:1.45;
  text-shadow:0 3px 12px #000
}
.left{left:-10px;text-align:left}
.right{right:-10px;text-align:right}

h1{
  font-size:clamp(46px,7vw,88px);
  font-weight:900;letter-spacing:3px;
  line-height:1;text-shadow:0 7px 30px #000
}
h1 span{color:#08a8ff}
.subtitle{font-size:24px;margin-top:22px;text-shadow:0 3px 10px #000}

.search-box{
  width:min(100%,920px);
  margin:75px auto 32px;
  background:#fff;border-radius:60px;
  padding:8px 10px 8px 22px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 20px 55px #0007
}
.search-icon{font-size:31px;color:#1769e0}
.search-input{
  flex:1;min-width:0;border:0;outline:0;
  font-size:21px;color:#222
}
.icon-btn{
  border:0;background:transparent;cursor:pointer;
  font-size:24px;padding:9px
}
.search-btn{
  border:0;background:#087ff5;color:#fff;
  min-width:125px;padding:15px 24px;
  border-radius:40px;font-size:18px;
  font-weight:800;cursor:pointer
}
.search-btn:hover{background:#0068d8}

.tabs{
  display:flex;justify-content:center;gap:12px;
  flex-wrap:wrap
}
.tab{
  border:1px solid rgba(255,255,255,.22);
  color:#fff;background:rgba(20,42,65,.58);
  backdrop-filter:blur(10px);
  padding:13px 23px;border-radius:35px;
  cursor:pointer;font-weight:700;font-size:16px
}
.tab.active{background:#fff;color:#126de0}

.bottom-card{
  width:min(100%,500px);margin:48px auto 0;
  padding:18px 25px;border-radius:28px;
  background:rgba(20,35,45,.62);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 15px 40px #0004
}
.bottom-card .big{font-family:cursive;font-size:29px}
.bottom-card .small{letter-spacing:4px;margin-top:12px;font-size:14px}

.status{margin-top:20px;font-size:13px;text-shadow:0 2px 8px #000}

@media(max-width:850px){
  .side{display:none}
  main{padding-top:65px}
}
@media(max-width:600px){
  body{background-attachment:scroll;background-position:center top}
  .page{padding:14px 12px 28px}
  header{align-items:center}
  .logo{font-size:21px}
  .top-links{gap:6px}
  .top-links a{display:none}
  .theme{padding:7px 12px;font-size:18px}
  main{padding-top:55px}
  h1{font-size:39px;letter-spacing:1px}
  .subtitle{font-size:17px;margin-top:14px}
  .search-box{
    margin-top:45px;
    padding:6px 7px 6px 12px;
    gap:3px;min-height:58px
  }
  .search-icon{font-size:24px}
  .search-input{font-size:15px}
  .icon-btn{font-size:19px;padding:6px}
  .search-btn{
    min-width:78px;padding:12px 12px;
    font-size:14px
  }
  .tab{padding:10px 14px;font-size:13px}
  .bottom-card{margin-top:32px}
  .bottom-card .big{font-size:24px}
}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="logo">ASIM <span>TECH</span></div>
  <div class="top-links">
    <a href="https://www.google.com" target="_blank">Google</a>
    <a href="https://www.youtube.com" target="_blank">YouTube</a>
    <a href="https://translate.google.com" target="_blank">Translate</a>
    <button class="theme" onclick="toggleTheme()" title="Change appearance">☀️</button>
  </div>
</header>

<main>
<section class="hero">
  <div class="side left">Knowledge<br>has no limits<br>— ASIM TECH</div>
  <div class="side right">Explore<br>Learn<br>Discover<br><span>a Better Tomorrow</span></div>

  <h1>ASIM <span>TECH</span> SEARCH</h1>
  <div class="subtitle">Search · Explore · Learn · Discover</div>

  <div class="search-box">
    <div class="search-icon">⌕</div>
    <input id="searchInput" class="search-input" placeholder="Search anything..."
           onkeydown="if(event.key==='Enter')performSearch()">
    <button class="icon-btn" onclick="voiceSearch()" title="Voice Search">🎙️</button>
    <button class="icon-btn" onclick="visualSearch()" title="Visual Search">📷</button>
    <button class="search-btn" onclick="performSearch()">Search</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="searchType('web',this)">🌐 Web</button>
    <button class="tab" onclick="searchType('images',this)">🖼️ Images</button>
    <button class="tab" onclick="searchType('news',this)">📰 News</button>
    <button class="tab" onclick="searchType('videos',this)">▶️ Videos</button>
    <button class="tab" onclick="searchType('scholar',this)">🎓 Scholar</button>
    <button class="tab" onclick="searchType('maps',this)">📍 Maps</button>
    <button class="tab" onclick="searchType('ai',this)">🤖 AI</button>
  </div>

  <div class="bottom-card">
    <div class="big">A Better Tomorrow</div>
    <div class="small">THROUGH KNOWLEDGE</div>
  </div>
  <div id="status" class="status"></div>
</section>
</main>
</div>

<script>
let type="web";

function q(){
  return document.getElementById("searchInput").value.trim();
}

function performSearch(){
  const query=q();
  if(!query){document.getElementById("searchInput").focus();return;}
  let url="https://www.google.com/search?q="+encodeURIComponent(query);

  if(type==="images") url="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(query);
  if(type==="news") url="https://www.google.com/search?tbm=nws&q="+encodeURIComponent(query);
  if(type==="videos") url="https://www.youtube.com/results?search_query="+encodeURIComponent(query);
  if(type==="scholar") url="https://scholar.google.com/scholar?q="+encodeURIComponent(query);
  if(type==="maps") url="https://www.google.com/maps/search/"+encodeURIComponent(query);
  if(type==="ai") url="https://chatgpt.com/?q="+encodeURIComponent(query);

  window.open(url,"_blank");
}

function searchType(t,el){
  type=t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("searchInput").focus();
}

function voiceSearch(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("Voice search is not supported in this browser.");
    return;
  }
  const r=new SpeechRecognition();
  r.lang="bn-IN";
  r.interimResults=false;
  r.onresult=e=>{
    document.getElementById("searchInput").value=e.results[0][0].transcript;
    performSearch();
  };
  r.start();
}

function visualSearch(){
  window.open("https://lens.google.com/","_blank");
}

function toggleTheme(){
  const body=document.body;
  if(body.dataset.light==="1"){
    body.dataset.light="0";
    body.style.filter="";
  }else{
    body.dataset.light="1";
    body.style.filter="brightness(1.12)";
  }
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body>
</html>
